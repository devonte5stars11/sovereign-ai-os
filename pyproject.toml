[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-os-kernel"
version = "5.1.0"
description = "Reference kernel for the Sovereign Hermes AI OS — capability routing, prompt graphs, workflow registry, artifacts, constitution."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ai-os-kernel = "ai_os_kernel.cli:main"

[tool.setuptools]
package-dir = {"" = "kernel"}
packages = ["ai_os_kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: runs against a real provider API; requires credentials (skipped otherwise)",
]
