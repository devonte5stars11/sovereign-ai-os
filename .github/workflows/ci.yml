name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: lint + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff bandit pytest-cov

      - name: Format check (ruff format --check)
        run: ruff format --check .

      - name: Lint (ruff check)
        run: ruff check .

      - name: Test + coverage (pytest with coverage gate >= 80%)
        run: pytest --cov=ai_os_kernel --cov-report=term-missing --cov-fail-under=80 -q

      - name: Security scan (bandit, advisory)
        if: always()
        run: bandit -q -r kernel/ai_os_kernel || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage
          if-no-files-found: ignore

  # Live integration tests run only when a GEMINI_API_KEY secret is configured.
  live:
    name: live tests (requires GEMINI_API_KEY)
    runs-on: ubuntu-latest
    needs: test
    if: ${{ secrets.GEMINI_API_KEY != '' }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run live tests
        run: pytest -q -m live
